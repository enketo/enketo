name: Transifex - pull translations

# Periodically pulls completed translations from Transifex and opens a PR,
# so translation work done by the community actually lands in the repo.
#
# Requires:
# - a `packages/enketo-express/.tx/config` file (generate locally with
#   `tx add remote` once, then commit it - see tutorials/40-translate.md)
# - a `TRANSIFEX_TOKEN` repository secret with a Transifex API token that has read
#   access to the enketo-express project

on:
    schedule:
        # Every Monday at 06:00 UTC
        - cron: '0 6 * * 1'
    workflow_dispatch: {}

jobs:
    pull-translations:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            pr-operation: ${{ steps.cpr.outputs.pull-request-operation }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Transifex CLI
              run: |
                  curl -o- https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash
                  echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

            - name: Pull translations
              working-directory: packages/enketo-express
              env:
                  TX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}
              # Only pull strings that have actually been translated, so untranslated
              # keys keep falling back to English instead of being overwritten with
              # empty/placeholder values.
              run: tx pull --all --mode onlytranslated

            - name: Open pull request
              id: cpr
              uses: peter-evans/create-pull-request@v6
              with:
                  commit-message: 'chore(i18n): update translations from Transifex'
                  title: 'chore(i18n): update translations from Transifex'
                  body: Automated update of translated strings pulled from Transifex.
                  branch: chore/transifex-translations
                  delete-branch: true
                  add-paths: |
                      packages/enketo-express/locales/src/**/translation.json

    notify-success:
        needs: pull-translations
        # Skip when tx pull found nothing new, so the PR step had nothing to commit
        if: success() && needs.pull-translations.outputs.pr-operation != ''
        uses: ./.github/workflows/zulip.yml
        secrets: inherit
        with:
            topic: 'Transifex automation'
            stream: 'Enketo'
            content: ':check: New translations pulled from Transifex - [check for an open PR](${{ github.server_url }}/${{ github.repository }}/pulls)'

    notify-failure:
        needs: pull-translations
        if: failure()
        uses: ./.github/workflows/zulip.yml
        secrets: inherit
        with:
            topic: 'Transifex automation'
            stream: 'Enketo'
            content: ':warning: @*devs*, [Transifex pull run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed'
